name: Deploy

# One bunny.net Magic Containers app holds both containers (api and web), so one workflow builds
# both images and then updates both containers. Database migrations are NOT run from here: the
# owner applies them by hand (docs/operations/deploy-checklist.md).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The container names inside the bunny.net app; they must match what the owner created.
  BUNNY_API_CONTAINER: connections-api
  BUNNY_WEB_CONTAINER: connections-web

# Third-party actions in this job see the registry login or the bunny.net key, so each is pinned
# to a full commit SHA (a tag can be moved to other code); the trailing comment names the release.
# To update one, look up the new release tag's commit and replace both.

jobs:
  deploy:
    name: Build, push and deploy api and web
    # workflow_dispatch can be started from any branch by anyone with write access. This job
    # builds the `latest` images and holds the bunny.net key, so it runs from main only, and in
    # the `production` environment, whose deployment-branch rule (main only) and secrets belong to
    # the owner (docs/operations/deploy-checklist.md, step 1).
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image identifiers
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api_image=ghcr.io/${OWNER}/connections-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${OWNER}/connections-web" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.api_image }}:latest
            ${{ steps.meta.outputs.api_image }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=min

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          platforms: linux/amd64
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.web_image }}:latest
            ${{ steps.meta.outputs.web_image }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Update api container on bunny.net Magic Containers
        uses: BunnyWay/actions/container-update-image@671d620bdaac002d2aa7f3dd0dda03dd99c5b749 # container-update-image_0.2.2
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ secrets.BUNNY_APP_ID }}
          container: ${{ env.BUNNY_API_CONTAINER }}
          image_tag: ${{ github.sha }}

      - name: Update web container on bunny.net Magic Containers
        uses: BunnyWay/actions/container-update-image@671d620bdaac002d2aa7f3dd0dda03dd99c5b749 # container-update-image_0.2.2
        with:
          api_key: ${{ secrets.BUNNY_API_KEY }}
          app_id: ${{ secrets.BUNNY_APP_ID }}
          container: ${{ env.BUNNY_WEB_CONTAINER }}
          image_tag: ${{ github.sha }}
