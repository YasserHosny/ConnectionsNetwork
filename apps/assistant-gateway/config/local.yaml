# Assistant Gateway configuration for local development.
#
# Secrets are never written here. Each *_env value names an environment variable.
#
# The dollar caps below are PLACEHOLDERS. The owner sets the real caps.

pricing:                          # USD per million tokens; per minute for speech
  claude-haiku-4-5:  {input: 1.00, output: 5.00,  cache_write: 1.25, cache_read: 0.10}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20}
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
  speech:
    openai:     {per_minute: 0.006}      # placeholder: check the provider's price before enabling
    elevenlabs: {per_minute: 0.006}      # placeholder: check the provider's price before enabling

providers:
  anthropic:  {api_key_env: ANTHROPIC_API_KEY}
  openai:     {api_key_env: OPENAI_API_KEY, model: gpt-4o-transcribe}    # placeholder model
  elevenlabs: {api_key_env: ELEVENLABS_API_KEY, model: scribe_v1}        # placeholder model

apps:
  connections:
    key_hash_env: AG_CONNECTIONS_KEY_HASH      # hash of the app's bearer key
    timezone: Africa/Cairo                     # for daily and monthly periods
    budget:
      monthly_cap_usd: 5.00                    # placeholder: the owner sets this
      per_user_daily_cap_usd: 1.00             # placeholder: the owner sets this
      warn_at: 0.8
    use_cases:
      person_add:
        model: claude-haiku-4-5                # to be set from the model trial
        effort: low                            # ignored by models without effort
        max_output_tokens: 2000
        max_input_chars: 20000
        speech: {mode: browser, language: ar-EG}
        max_audio_seconds: 60

  connections-trial:                           # the model trial: own key, own cap
    key_hash_env: AG_TRIAL_KEY_HASH
    timezone: Africa/Cairo
    budget: {monthly_cap_usd: 5.00, warn_at: 0.8}    # placeholder: the owner sets this
    use_cases:
      eval:
        model: per-request                     # the trial may name any priced model
        speech: {mode: server, provider: per-request}
        max_output_tokens: 2000
        max_audio_seconds: 60
