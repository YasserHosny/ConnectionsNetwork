[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "assistant-gateway"
version = "0.1.0"
description = "Connections Network Assistant Gateway: LLM and speech provider proxy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "slowapi==0.1.9",
    "httpx==0.28.1",
    "pyyaml>=6,<7",
    "anthropic>=2.14,<3",
    "av>=19,<20",
    "python-multipart>=0.0.20,<1",
    # python:3.12-slim may lack /usr/share/zoneinfo; ZoneInfo("Africa/Cairo") must work anyway.
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "assistant_gateway/migrations"

[tool.hatch.build.targets.sdist]
include = [
    "src/assistant_gateway",
    "migrations",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
