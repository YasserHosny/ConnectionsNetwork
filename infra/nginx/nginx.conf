# Rendered at container start by infra/nginx/entrypoint.sh (envsubst of BACKEND_HOST only).

# The access log carries the method, the path and the status, nothing else: no query string
# (search text and tag queries travel there) and no headers (X-Contributor-Token, Authorization).
# `$uri` is the normalised path without the query; `$request_uri` and `$request` must not be used.
log_format minimal '$request_method $uri $status';

# $api_client: the client address handed to the API, which its per-address rate limits key on.
# Written by infra/nginx/entrypoint.sh from TRUST_CDN_REAL_IP: true (the hosted web container,
# behind bunny.net's CDN) takes the X-Real-IP the edge sets, when it looks like an address;
# otherwise, and always under docker compose, it is Nginx's peer. Nginx's own connection address
# stays the peer (no realip module), so its error log never carries a visitor's address.
include /etc/nginx/conf.d/real-ip.inc;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout minimal;
    # nginx's error log quotes the whole request line, query string included, when an upstream
    # fails (`request: "GET /api/v1/x?q=... HTTP/1.1"`), and that line cannot be reformatted.
    # Request-level errors are therefore not logged here (a failed upstream still shows up as a
    # 502/504 in the access log); startup and worker-level problems are logged at the main level.
    error_log /dev/stderr crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    include /etc/nginx/conf.d/security-headers.inc;

    # Never cached: the shell, the service worker and its manifest, the deployment config and the
    # translation catalogues all change without a new hashed file name, and a stale copy of any
    # of them would pin users to an old build or an old configuration.
    location ~ ^/(index\.html|ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|runtime-config\.json|version\.txt)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ ^/assets/i18n/.*\.json$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # API proxy. BACKEND_HOST is `127.0.0.1` in the shared bunny.net app (both containers share
    # one network namespace; an IP, not `localhost`, which can resolve to ::1 where uvicorn does
    # not listen) and `api` under docker compose.
    #
    # API responses carry contact data: never stored by a browser, the service worker or a CDN.
    # The API sets the same header itself (shared/no_store.py); it is hidden and set once here so
    # the response carries exactly one. The security headers are repeated because this location
    # declares its own add_header.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # The client address for the per-address rate limits: $api_client (top of this file).
        # On bunny.net, Nginx's peer is the CDN edge, not the visitor: keying on it put every
        # visitor behind an edge in one budget. X-Forwarded-For is never used: a visitor can
        # write it, and the CDN passes it on. The API gets exactly one address, as both headers,
        # and uvicorn (which trusts only 127.0.0.1, this Nginx) takes it.
        # scripts/test-real-ip.sh checks the chain.
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $api_client;
        proxy_set_header X-Forwarded-For $api_client;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        # Request bodies are small JSON documents; nginx's own default says so explicitly.
        client_max_body_size 1m;
    }

    # SPA fallback: unknown paths (/c, /people/...) get index.html, which the exact-match block
    # above serves with no-store.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
