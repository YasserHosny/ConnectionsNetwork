# Lives at the repo root, not in apps/api: `uv run --project apps/api pytest` run from the root
# looks for its config upward from the cwd, so a pyproject.toml under apps/api would be ignored.
[pytest]
testpaths = apps/api/tests
# starlette 0.41 (pinned by fastapi 0.115.6) trips an anyio deprecation inside its TestClient.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
